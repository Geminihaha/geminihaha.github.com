<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오프라인 - MountWalker 마운트워커</title>
    <meta name="theme-color" content="#2d6a4f">
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #1b4332 0%, #2d6a4f 50%, #40916c 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        .card {
            max-width: 420px;
            background: rgba(255,255,255,0.10);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 50px 36px;
            border: 1px solid rgba(255,255,255,0.18);
        }
        .icon { font-size: 5rem; margin-bottom: 16px; }
        h1 { font-size: 1.8rem; margin-bottom: 12px; color: #ffd166; }
        p { font-size: 1.05rem; opacity: 0.92; margin-bottom: 26px; line-height: 1.7; }
        .btn {
            background: #ffd166;
            color: #1b4332;
            border: none;
            padding: 14px 36px;
            border-radius: 50px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .btn:hover { background: #ffed4a; transform: scale(1.04); }
        .hint { margin-top: 24px; font-size: 0.85rem; opacity: 0.75; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🏔️📡</div>
        <h1>오프라인 상태입니다</h1>
        <p>
            현재 인터넷에 연결되어 있지 않아요.<br>
            하지만 걱정 마세요! MountWalker는<br>
            <strong style="color:#ffd166;">이미 방문한 등산 정보와 준비물 체크리스트</strong>를<br>
            오프라인에서도 확인할 수 있어요. ⛰️
        </p>
        <button class="btn" onclick="location.href='./index.html'">🔄 다시 시도</button>
        <p class="hint">💡 온라인으로 접속했던 명산 정보가 캐시에 저장되어 표시됩니다.<br>지도 타일은 온라인 연결 시에만 로드됩니다.</p>
    </div>
</body>
</html>
