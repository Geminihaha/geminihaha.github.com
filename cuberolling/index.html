<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="Cube Rolling 3D - 2x2 & 3x3 루빅스 큐브 웹 퍼즐 게임 PWA">
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#161b22">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CubeRolling">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <link rel="manifest" href="./manifest.json">

    <title>Cube Rolling 3D - 2x2 & 3x3 루빅스 큐브 퍼즐 PWA</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- ES Modules Import Map for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/examples/jsm/controls/OrbitControls.js": "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js"
            }
        }
    </script>
</head>
<body>
    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <!-- UI Overlay Layer -->
    <div class="ui-layer">
        <!-- Long-Press Free-Look Indicator (shown while holding the cube, separate from the button) -->
        <div id="inspect-indicator" class="inspect-indicator">
            <span>🖐️</span> 둘러보기 중 · 손을 떼면 해제
        </div>

        <!-- Top Navigation Header -->
        <header>
            <div class="brand">
                <span class="brand-icon">🧊</span>
                <h1>Cube Rolling 3D</h1>
            </div>

            <!-- PWA Install Button (Appears if installable) -->
            <button id="btn-pwa-install" title="앱으로 설치하기">
                📲 앱 설치
            </button>

            <!-- Mode Selector (2x2 vs 3x3) -->
            <div class="mode-selector">
                <button id="mode-2x2" class="mode-btn">2x2</button>
                <button id="mode-3x3" class="mode-btn active">3x3</button>
            </div>

            <!-- Stats Panel -->
            <div class="stats-panel">
                <div class="stat-box">
                    <span class="stat-label">TIME</span>
                    <span id="timer-display" class="stat-value">00:00</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">MOVES</span>
                    <span id="moves-display" class="stat-value">0</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">BEST</span>
                    <span id="best-display" class="stat-value gold">--:--</span>
                </div>
            </div>
        </header>

        <!-- Rotation Quick Buttons Panel (Desktop & Mobile) -->
        <div class="controls-hint">
            <div class="controls-title">QUICK ROTATE</div>
            <div class="key-grid">
                <button class="key-btn" data-key="U" title="Up Face (U)">U</button>
                <button class="key-btn" data-key="D" title="Down Face (D)">D</button>
                <button class="key-btn" data-key="L" title="Left Face (L)">L</button>
                <button class="key-btn" data-key="R" title="Right Face (R)">R</button>
                <button class="key-btn" data-key="F" title="Front Face (F)">F</button>
                <button class="key-btn" data-key="B" title="Back Face (B)">B</button>
            </div>
        </div>

        <!-- Bottom Action Toolbar (frequent actions only) -->
        <footer>
            <button id="btn-inspect" class="btn" title="큐브 시점 자유 둘러보기 모드">
                <span>🔍</span> 둘러보기
            </button>
            <button id="btn-toggle-quick" class="btn" title="퀵 회전 버튼 토글">
                <span>⚡</span> 퀵회전
            </button>
            <button id="btn-zoom-out" class="btn btn-icon" title="큐브 축소">
                ➖
            </button>
            <button id="btn-zoom-in" class="btn btn-icon" title="큐브 확대">
                ➕
            </button>
            <button id="btn-undo" class="btn" title="되돌리기">
                <span>↩️</span> Undo
            </button>
            <button id="btn-redo" class="btn" title="다시 실행">
                <span>↪️</span> Redo
            </button>
            <button id="btn-mute" class="btn btn-icon" title="소리 토글">
                🔊
            </button>
        </footer>
    </div>

    <!-- Game Menu FAB: scramble / scan / finish live here so they can't be
         pressed accidentally during play -->
    <button id="btn-game-menu" class="game-menu-fab" title="게임 메뉴 (섞기 / 촬영 / 마침)">🎮</button>
    <div id="game-menu" class="game-menu-panel">
        <div class="game-menu-title">게임</div>
        <button id="btn-scramble" class="btn btn-primary">🔀 섞기</button>
        <button id="btn-scan" class="btn" title="실제 큐브를 촬영해 패턴 가져오기">📷 촬영</button>
        <button id="btn-finish" class="btn" title="큐브를 다 맞추면 누르세요">🏁 마침</button>
        <button id="btn-reset" class="btn" title="리셋">🔄 Reset</button>
    </div>

    <!-- Cube Scanner Modal (semi-automatic pattern input) -->
    <div id="scanner-modal" class="scanner-overlay">
        <div class="scanner-card">
            <div class="scanner-header">
                <h2>📷 큐브 패턴 가져오기</h2>
                <button id="btn-scanner-close" class="btn btn-icon" title="닫기">✕</button>
            </div>

            <div class="scanner-stage">
                <video id="scanner-video" autoplay playsinline muted></video>
                <div id="scanner-grid" class="scanner-grid"></div>
                <div class="scanner-face-hint" id="scanner-face-hint"></div>
            </div>

            <div class="scanner-controls">
                <div class="scanner-row">
                    <span class="scanner-label">면 선택</span>
                    <div class="face-tabs" id="scanner-face-tabs">
                        <button class="face-tab" data-face="U">U</button>
                        <button class="face-tab" data-face="D">D</button>
                        <button class="face-tab" data-face="L">L</button>
                        <button class="face-tab" data-face="R">R</button>
                        <button class="face-tab" data-face="F">F</button>
                        <button class="face-tab" data-face="B">B</button>
                    </div>
                </div>

                <div class="scanner-row">
                    <span class="scanner-label">색 선택</span>
                    <div class="palette" id="scanner-palette"></div>
                </div>

                <div class="scanner-status" id="scanner-status"></div>

                <div class="scanner-actions">
                    <button id="btn-scanner-auto" class="btn" title="캡처하면 색을 자동으로 입력합니다">✨ 자동입력</button>
                    <button id="btn-scanner-capture" class="btn">📷 캡처</button>
                    <button id="btn-scanner-clear" class="btn">🗑 면 지우기</button>
                    <button id="btn-scanner-start" class="btn btn-primary" disabled>✅ 이 패턴으로 시작</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Win Celebration Modal -->
    <div id="win-modal" class="modal-overlay">
        <div class="modal-card">
            <h2 id="win-title">🎉 축하합니다!</h2>
            <p>큐브를 성공적으로 완성했습니다!</p>
            
            <div class="modal-stats">
                <div class="stat-box">
                    <span class="stat-label">소요 시간</span>
                    <span id="final-time" class="stat-value">00:00</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">회전 횟수</span>
                    <span id="final-moves" class="stat-value">0</span>
                </div>
            </div>

            <button id="btn-modal-close" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px;">
                새 게임 시작하기 ✨
            </button>
        </div>
    </div>

    <!-- Application Script Entry Point -->
    <script type="module" src="./js/main.js"></script>

    <!-- PWA Service Worker Registration & Install Prompt -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('[PWA] Service Worker registered:', reg.scope))
                    .catch((err) => console.error('[PWA] Service Worker registration failed:', err));
            });
        }

        let deferredPrompt;
        const installBtn = document.getElementById('btn-pwa-install');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            if (installBtn) {
                installBtn.style.display = 'inline-block';
            }
        });

        if (installBtn) {
            installBtn.addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    console.log(`User response to install prompt: ${outcome}`);
                    deferredPrompt = null;
                    installBtn.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
